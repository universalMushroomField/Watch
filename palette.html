<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色板编辑器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f2ed;color:#222521;font:15px/1.5 system-ui,sans-serif}
main{max-width:1280px;margin:auto;padding:clamp(16px,4vw,56px)}
h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.05em;margin:0 0 6px;line-height:1.15}
p{margin:0;color:#565b55}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:24px 0 12px}
.toolbar label{display:flex;align-items:center;gap:8px}
button,input{font:inherit;color:inherit}
button,input:not([type=color]){border:1px solid #c8cbc3;border-radius:7px;background:#fff;padding:7px 11px}
button{cursor:pointer}
button:hover{border-color:#4a5d4f}
button:focus-visible,input:focus-visible{outline:3px solid #266bb0;outline-offset:2px}
.primary{background:#253c30;color:white;border-color:#253c30}
#levels{width:72px}
#status{margin-left:auto;font-size:13px}
.board{overflow:auto;border:1px solid #d4d6cf;border-radius:12px;background:white}
table{border-spacing:0;min-width:100%;table-layout:fixed}
thead th{background:#fafaf7;font-size:12px;color:#565b55;padding:8px 2px}
th:first-child{position:sticky;left:0;z-index:1;background:#fafaf7}
tbody th{padding:0 6px;border-top:1px solid #eeefe9;text-align:left}
.family{width:116px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:transparent;border-color:transparent}
td{padding:0;min-width:43px}
.swatch{border:0;border-radius:0;display:block;width:100%;min-width:43px;height:38px;padding:0}
.swatch:hover,.swatch:focus-visible{outline:2px solid white;outline-offset:-4px;box-shadow:inset 0 0 0 2px #252525}
dialog{width:min(420px,calc(100% - 32px));border:1px solid #c8cbc3;border-radius:14px;padding:22px;color:inherit}
dialog::backdrop{background:#19251ed0}
h2{font-size:20px;margin:0 0 14px}
.fields{display:flex;align-items:center;gap:10px}
.fields input[type=text]{min-width:0;flex:1}
.fields input[type=color]{width:64px;height:40px;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .primary{margin-left:auto}
.danger{color:#9d2828}
</style>
</head>
<body>
<main>
<header><h1>色板编辑器</h1><p>每行一个色系，色阶从左到右排列。点击色块改色，点击色系名称可重命名或在其下方插入新色系。</p></header>
<div class="toolbar">
<label for="levels">色阶数 <input id="levels" type="number" min="1" max="48" required></label>
<button type="button" class="primary" id="add">添加色系</button>
<button type="button" id="export">导出 HTML</button>
<p id="status" role="status"></p>
</div>
<div class="board" tabindex="0" aria-label="色板，可横向滚动">
<table aria-label="色系与明度色阶"><thead></thead><tbody></tbody></table>
</div>
</main>
<dialog id="editor" aria-labelledby="editor-title">
<form id="edit-form">
<h2 id="editor-title"></h2>
<div class="fields">
<input id="picker" type="color" aria-label="取色器">
<input id="value" type="text" required autocomplete="off">
</div>
<div class="actions">
<button type="button" id="insert">在下方插入</button>
<button type="button" id="remove" class="danger">删除色系</button>
<button type="button" id="cancel">取消</button>
<button class="primary" type="submit">保存</button>
</div>
</form>
</dialog>
<script id="palette-data" type="application/json">null</script>
<script>
'use strict';
const $ = selector => document.querySelector(selector);
const initialColors = `
FFEBEE FECDD2 EE9A9B E47474 EE5452 F2453A E43B38 D23132 C52A2B B61F20
FCE4EC F8BBD0 F38FB1 EF6392 EB427A E82264 D71F60 C11B5B AC1757 88104F
F3E5F5 E2BEE6 CF93D7 BB68C6 AC47BA 9D27AE 9024A8 7D1FA0 6C1A98 4D138A
EDE7F6 D2C4E8 B49DDA 9775CB 8157C0 6B39B5 6234AF 552CA6 4A269E 371A90
E8EAF6 C6CAE8 A1A8D9 7C86C9 606BBE 4650B3 4048A9 373E9D 2F3491 22227C
E4F2FD BDDEFA 93CAF8 6AB4F4 4DA4F3 3595F1 3187E3 2C75D0 2764BE 1E469F
E2F5FE B5E5FB 85D4F9 57C2F5 39B5F4 27A8F2 259AE3 2187CF 1D76BB 165699
E0F7FA B3EBF1 83DEE9 53D0E0 31C6D9 1CBCD3 18ACC0 1397A6 0F838E 076064
E0F2F1 B3DFDB 81CBC4 4FB6AC 2AA69A 0A9688 07897B 05796B 04695C 014D40
E8F5E9 C8E6CA A4D6A8 80C786 64BB6D 4AAF54 41A04B 368E3F 2C7D35 195E23
F1F8E9 DBEDC9 C4E1A7 ACD584 9ACC69 89C350 7AB348 669F3D 538B34 316922
F9FBE8 EFF4C5 E4EE9F DAE77A D2E15F CADC45 BECA3E ADB436 9C9D2E 81771F
FEFDE8 FEF9C6 FDF5A1 FDF17C FCEE61 FCEB49 FBD843 F9C03B F7A933 F38025
FEF8E2 FEECB5 FDE086 FDD558 FDCB38 FDC227 FDB422 FDA11F FD901D FD7019
FEF3E1 FEE0B4 FDCC84 FDB854 FDA833 FD991E F98D1C F37D19 ED6D17 E45213
FBE9E7 FECCBD FEAC93 FD8B68 FD7148 FD592A F25326 E44C22 D7451D BE3815
EFEBE9 D7CCC8 BCAAA4 A0887F 8C6E64 785549 6C4C42 5D4038 4E342E 3E2723
FAFAFA F5F5F5 EEEEEE E0E0E0 BDBDBD 9E9E9E 757575 616161 424242 212121
ECEFF1 CFD8DC B0BEC5 91A4AE 79909C 617D8A 556E7A 465A64 38474F 263238
`.trim().split('\n');
const names = '红 粉 紫 深紫 靛蓝 蓝 浅蓝 青 蓝绿 绿 浅绿 黄绿 黄 琥珀 橙 红橙 棕 灰 蓝灰'.split(' ');
const embedded = JSON.parse($('#palette-data').textContent);
let palette = embedded ?? {
  id: 'reference-v1', levels: 10,
  rows: names.map((name, index) => ({
    name, colors: initialColors[index].split(' ').map(color => '#' + color)
  }))
};
const storageKey = 'offline-palette:' + palette.id;
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved?.id === palette.id) palette = saved;
  $('#status').textContent = '修改自动保存在此浏览器';
} catch {
  $('#status').textContent = '请导出 HTML 保留修改';
}
const dialog = $('#editor');
const value = $('#value');
const picker = $('#picker');
const levels = $('#levels');
const hexPattern = /^#?[0-9a-f]{6}$/i;
let editing;
let focusOnClose;

function normalize(color) {
  return '#' + color.replace(/^#/, '').toUpperCase();
}

function blend(from, to, fraction) {
  const channel = offset => {
    const start = parseInt(from.slice(offset, offset + 2), 16);
    const end = parseInt(to.slice(offset, offset + 2), 16);
    return Math.round(start + (end - start) * fraction).toString(16).padStart(2, '0');
  };
  return ('#' + [1, 3, 5].map(channel).join('')).toUpperCase();
}

function makeScale(base, count) {
  if (count === 1) return [base];
  return Array.from({length: count}, (_, index) => {
    const position = index / (count - 1);
    return position <= 0.5
      ? blend('#FFFFFF', base, 0.12 + position * 1.76)
      : blend(base, '#000000', (position - 0.5) * 1.4);
  });
}

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(palette));
    $('#status').textContent = '已保存到此浏览器';
  } catch {
    $('#status').textContent = '浏览器存储不可用，请导出 HTML';
  }
  render();
}

function button(text, className, action) {
  const element = document.createElement('button');
  element.type = 'button';
  element.className = className;
  element.textContent = text;
  element.addEventListener('click', action);
  return element;
}

function render() {
  levels.value = palette.levels;
  const header = document.createElement('tr');
  for (let index = 0; index <= palette.levels; index++) {
    const cell = document.createElement('th');
    cell.scope = 'col';
    cell.textContent = index === 0 ? '色系' : index;
    header.append(cell);
  }
  $('thead').replaceChildren(header);
  const body = document.createDocumentFragment();
  palette.rows.forEach((family, row) => {
    const line = document.createElement('tr');
    const label = document.createElement('th');
    label.scope = 'row';
    const name = button(family.name, 'family', () => openEditor('family', row));
    name.title = family.name;
    name.id = 'family-' + row;
    label.append(name);
    line.append(label);
    family.colors.slice(0, palette.levels).forEach((color, column) => {
      const cell = line.insertCell();
      const swatch = button('', 'swatch', () => openEditor('color', row, column));
      swatch.id = 'swatch-' + row + '-' + column;
      swatch.style.backgroundColor = color;
      swatch.title = family.name + ' · 色阶 ' + (column + 1) + ' · ' + color;
      swatch.setAttribute('aria-label', swatch.title);
      cell.append(swatch);
    });
    body.append(line);
  });
  $('tbody').replaceChildren(body);
}

function configureEditor(mode, row, column) {
  editing = {mode, row, column};
  const family = palette.rows[row];
  $('#editor-title').textContent = {
    add: '插入色系', family: '编辑色系', color: '编辑色块'
  }[mode];
  picker.hidden = mode === 'family';
  $('#insert').hidden = $('#remove').hidden = mode !== 'family';
  value.setCustomValidity('');
  value.maxLength = mode === 'color' ? 7 : 40;
  value.setAttribute('aria-label', mode === 'color' ? 'HEX 颜色' : '色系名称');
  value.value = mode === 'color' ? family.colors[column] : mode === 'family' ? family.name : '新色系';
  picker.value = mode === 'color' ? family.colors[column] : '#63838c';
  picker.setAttribute('aria-label', mode === 'add' ? '色系基准色' : '取色器');
  value.focus();
  value.select();
}

function openEditor(mode, row, column) {
  focusOnClose = document.activeElement.id;
  dialog.showModal();
  configureEditor(mode, row, column);
}

dialog.addEventListener('close', () => document.getElementById(focusOnClose)?.focus());
$('#add').onclick = () => openEditor('add', palette.rows.length);
$('#insert').onclick = () => configureEditor('add', editing.row + 1);
$('#cancel').onclick = () => dialog.close();
$('#remove').onclick = () => {
  if (!confirm('删除色系「' + palette.rows[editing.row].name + '」及其所有色阶？')) return;
  palette.rows.splice(editing.row, 1);
  focusOnClose = palette.rows.length ? 'family-' + Math.min(editing.row, palette.rows.length - 1) : 'add';
  persist();
  dialog.close();
};
picker.oninput = () => {
  if (editing.mode === 'color') {
    value.value = picker.value.toUpperCase();
    value.setCustomValidity('');
  }
};
value.oninput = () => {
  value.setCustomValidity('');
  if (editing.mode === 'color' && hexPattern.test(value.value.trim())) {
    picker.value = normalize(value.value.trim());
  }
};
$('#edit-form').onsubmit = event => {
  event.preventDefault();
  const {mode, row, column} = editing;
  const input = value.value.trim();
  if (!input || (mode === 'color' && !hexPattern.test(input))) {
    value.setCustomValidity(mode === 'color' ? '请输入六位 HEX 颜色，例如 #63838C' : '请输入色系名称');
    value.reportValidity();
    return;
  }
  if (mode === 'color') palette.rows[row].colors[column] = normalize(input);
  if (mode === 'family') palette.rows[row].name = input;
  if (mode === 'add') {
    palette.rows.splice(row, 0, {name: input, colors: makeScale(picker.value, palette.levels)});
    focusOnClose = 'family-' + row;
  }
  persist();
  dialog.close();
};
levels.onchange = () => {
  if (!levels.checkValidity()) {
    levels.reportValidity();
    levels.value = palette.levels;
    return;
  }
  const count = levels.valueAsNumber;
  for (const {colors} of palette.rows) {
    const missing = count - colors.length;
    const last = colors.at(-1);
    for (let index = 1; index <= missing; index++) {
      colors.push(blend(last, '#000000', 0.58 * index / missing));
    }
  }
  palette.levels = count;
  persist();
};
$('#export').onclick = () => {
  const copy = document.documentElement.cloneNode(true);
  copy.querySelector('#palette-data').textContent = JSON.stringify({
    ...palette, id: 'snapshot-' + Date.now() + '-' + Math.random().toString(36).slice(2)
  }).replace(/</g, '\\u003c');
  for (const selector of ['thead', 'tbody', '#status']) copy.querySelector(selector).replaceChildren();
  const file = new Blob(['<!doctype html>\n', copy.outerHTML], {type:'text/html;charset=utf-8'});
  const link = document.createElement('a');
  const url = URL.createObjectURL(file);
  link.href = url;
  link.download = 'palette-' + new Date().toISOString().slice(0, 10) + '.html';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
};
render();
</script>
</body>
</html>
